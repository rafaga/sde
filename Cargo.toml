[package]
name = "sde"
authors = ["Rafael Amador <rafaga@duck.com>"]
description = "A library to read Eve Online's SDE data from sqlite database."
readme = "README.md"
repository = "https://github.com/rafaga/sde/"
keywords = ["sde", "eve-online"]
categories = ["games", "value-formatting"]
exclude = ["tests/",".github/",".gitignore"]
version = "0.1.2"
edition = "2024"
license = "MIT"

[lib]
name = "sde"
path = "src/lib.rs"

[[bin]]
name = "sde-builder"
path = "src/bin/cli.rs"
required-features = ["builder"]

[[bin]]
name = "sde-builder-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[badges]
# The `maintenance` table indicates the status of the maintenance of
# the crate. This may be used by a registry, but is currently not
# used by crates.io. See https://github.com/rust-lang/crates.io/issues/2437
# and https://github.com/rust-lang/crates.io/issues/2438 for more details.
#
# The `status` field is required. Available options are:
# - `actively-developed`: New features are being added and bugs are being fixed.
# - `passively-maintained`: There are no plans for new features, but the maintainer intends to
#   respond to issues that get filed.
# - `as-is`: The crate is feature complete, the maintainer does not intend to continue working on
#   it or providing support, but it works for the purposes it was designed for.
# - `experimental`: The author wants to share it with the community but is not intending to meet
#   anyone's particular use case.
# - `looking-for-maintainer`: The current maintainer would like to transfer the crate to someone
#   else.
# - `deprecated`: The maintainer does not recommend using this crate (the description of the crate
#   can describe why, there could be a better solution available or there could be problems with
#   the crate that the author does not want to fix).
# - `none`: Displays no badge on crates.io, since the maintainer has not chosen to specify
#   their intentions, potential crate users will need to investigate on their own.
maintenance = { status = "actively-developed" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
builder = [
    "dep:reqwest",
    "dep:tokio",
    "dep:futures",
    "dep:zip",
    "dep:roxmltree",
    "dep:serde",
    "dep:serde_json",
    "dep:clap",
    "dep:anyhow",
]
gui = ["builder", "dep:eframe"]

[dependencies]
kdtree = "0.8"
rstar = "0.13"
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "blob", "array"] }

# --- Dependencias opcionales, solo activas con la feature "builder" ---
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"], optional = true }
futures = { version = "0.3", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.21.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

# --- Solo activa con la feature "gui", alineada a la versión de egui/eframe que ya usa egui-map ---
eframe = { version = "0.36.1", optional = true }

[dev-dependencies]
wiremock = "0.6"
